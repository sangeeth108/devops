- hosts: localhost
  connection: local
  become: no
  tasks:
    - name: Ensure Docker is running
      command: systemctl status docker
      register: docker_status
      changed_when: false
      failed_when: docker_status.rc != 0

    - name: Create Docker network if it doesn't exist
      command: docker network inspect food-app-network
      register: network_inspect
      failed_when: false
      changed_when: false

    - name: Create the network if it doesn't exist
      command: docker network create food-app-network
      when: network_inspect.rc != 0
      register: network_result
      failed_when: network_result.rc != 0 and "already exists" not in network_result.stderr
      changed_when: network_result.rc == 0